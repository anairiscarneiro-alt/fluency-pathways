
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluency Pathway | Lesson Library</title>
<style>
:root {
  --bg:#f6f4ef;
  --paper:#fffefa;
  --ink:#30312f;
  --muted:#777973;
  --line:#e6e3dc;
  --a1:#dcebcf;
  --a2:#d9e9e6;
  --b1:#f5e3bc;
  --b2:#e7ddf3;
  --c1:#f1d8d9;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
  line-height:1.5;
}
button { font:inherit; cursor:pointer; }
header {
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:20px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand {
  font-family:Georgia,serif;
  font-size:25px;
  font-weight:bold;
}
.brand small {
  display:block;
  font:11px system-ui,sans-serif;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}
.header-right {
  font-size:13px;
  color:var(--muted);
}
.shell {
  max-width:1400px;
  margin:auto;
  padding:30px 24px;
  display:grid;
  grid-template-columns:210px 315px minmax(0,1fr);
  gap:22px;
  align-items:start;
}
.panel {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
}
.pad { padding:22px; }
.eyebrow {
  font-size:11px;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:750;
  margin:0 0 17px;
}
.level {
  width:100%;
  border:0;
  background:transparent;
  border-radius:9px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:5px;
  color:var(--ink);
}
.level:hover,.level.active { background:#f1efe9; }
.pill {
  width:39px;
  height:31px;
  border-radius:7px;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:800;
}
.level span:last-child {
  font-size:13px;
  font-weight:600;
}
.panel-heading {
  padding:23px 21px 15px;
  border-bottom:1px solid var(--line);
}
.panel-heading h2 {
  font-family:Georgia,serif;
  font-size:25px;
  margin:0 0 5px;
}
.sub {
  color:var(--muted);
  font-size:12px;
}
.lesson-list { padding:9px; }
.lesson {
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  padding:15px 13px;
  border-radius:9px;
  color:var(--ink);
  margin-bottom:3px;
}
.lesson:hover,.lesson.active { background:#f0eee7; }
.lesson .num {
  display:block;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.3px;
  color:var(--muted);
  margin-bottom:4px;
}
.lesson strong {
  font-size:13px;
  display:block;
}
.lesson .desc {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}
.reader {
  padding:36px 44px;
  min-height:660px;
}
.reader .top {
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:22px;
}
.tag {
  font-size:11px;
  padding:5px 10px;
  border-radius:6px;
  font-weight:750;
}
.reader h1 {
  font-family:Georgia,serif;
  font-size:clamp(30px,3vw,44px);
  line-height:1.12;
  margin:0 0 10px;
}
.reader .intro {
  font-size:14px;
  color:var(--muted);
  margin:0 0 30px;
}
.objective {
  border-left:3px solid #7b9270;
  background:#f4f5ef;
  padding:17px 20px;
  border-radius:0 9px 9px 0;
  margin-bottom:35px;
}
.objective strong {
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.objective p {
  font-size:13px;
  margin:7px 0 0;
}
.reader h3 {
  font-family:Georgia,serif;
  font-size:23px;
  margin:31px 0 8px;
}
.reader p { font-size:14px; }
.chips {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0;
}
.chip {
  border:1px solid var(--line);
  border-radius:7px;
  padding:8px 12px;
  font-size:13px;
  background:#fff;
}
.sample {
  font-size:13px;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  margin-top:14px;
}
.sample div {
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:11px 15px;
  border-bottom:1px solid var(--line);
}
.sample div:first-child {
  background:#f4f2ec;
  font-weight:750;
}
.sample div:last-child { border-bottom:0; }
.empty {
  color:var(--muted);
  padding:24px 0;
}
.footer {
  max-width:1400px;
  margin:0 auto;
  padding:25px 24px 34px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--muted);
}
.partner-logos {
  display:flex;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
}
.partner-logo {
  display:block;
  object-fit:contain;
  max-width:100%;
}
.partner-logo.go-higher {
  width:132px;
  height:48px;
}
.partner-logo.meridian {
  width:125px;
  height:48px;
}
@media(max-width:1050px) {
  .shell { grid-template-columns:175px minmax(0,1fr); }
  .reader { grid-column:1/-1; }
  .lesson-list { max-height:450px; overflow:auto; }
}
@media(max-width:650px) {
  header { padding:17px 18px; }
  .header-right { display:none; }
  .shell { padding:16px; display:block; }
  .panel { margin-bottom:14px; }
  .level-nav { display:flex; gap:6px; overflow:auto; }
  .level { flex:0 0 auto; width:auto; margin:0; }
  .level span:last-child { display:none; }
  .pad { padding:16px; }
  .reader { padding:25px 20px; min-height:420px; }
  .panel-heading { padding:17px; }
  .lesson-list { max-height:250px; overflow:auto; }
  .reader h1 { font-size:33px; }
  .footer { justify-content:center; text-align:center; }
  .partner-logos { justify-content:center; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    Fluency Pathway
    <small>English Lesson Library</small>
  </div>
  <div class="header-right">
    A clear path to confident communication.
  </div>
</header>

<main class="shell">
  <aside class="panel pad">
    <p class="eyebrow">Choose your level</p>
    <nav id="levels" class="level-nav"></nav>
  </aside>

  <section class="panel">
    <div class="panel-heading">
      <p class="eyebrow">Lesson collection</p>
      <h2 id="list-title">A1 · Beginner</h2>
      <div class="sub" id="list-subtitle">
        Choose a lesson to begin
      </div>
    </div>
    <div class="lesson-list" id="lessons"></div>
  </section>

  <article class="panel reader" id="reader"></article>
</main>

<footer class="footer">
  <span>Fluency Pathway · English Lesson Library</span>
  <div class="partner-logos">
    <img
      class="partner-logo go-higher"
      src="go-higher-logo.png"
      alt="Go Higher"
    >
    <img
      class="partner-logo meridian"
      src="meridian-logo.png"
      alt="Meridian"
    >
  </div>
</footer>

<script>
const levels = [
  {id:'A1',name:'Beginner',color:'#dcebcf'},
  {id:'A2',name:'Elementary',color:'#d9e9e6'},
  {id:'B1',name:'Intermediate',color:'#f5e3bc'},
  {id:'B2',name:'Upper Intermediate',color:'#e7ddf3'},
  {id:'C1',name:'Advanced',color:'#f1d8d9'}
];

// Aulas demonstrativas. Depois serão substituídas pelo Notion.
const lessons = {
  A1: [
    {
      number:1,
      title:'Nice to Meet You!',
      description:'Greetings and first encounters',
      objective:'Greet someone, introduce yourself and say goodbye in English.',
      grammar:'Basic greetings and “I’m”',
      vocab:[
        ['Hello!','Olá!'],
        ['Good morning!','Bom dia!'],
        ['Nice to meet you.','Prazer em conhecer você.'],
        ['Goodbye!','Tchau!']
      ]
    },
    {
      number:2,
      title:'About Me',
      description:'Personal information',
      objective:'Share basic personal information.',
      grammar:'I am / My name is',
      vocab:[
        ['My name is…','Meu nome é…'],
        ['I am from…','Eu sou de…']
      ]
    }
  ],
  A2:[],
  B1:[],
  B2:[],
  C1:[]
};

let selectedLevel = 'A1';
let selectedLesson = 0;

const $ = id => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function render() {
  const lvl = levels.find(x => x.id === selectedLevel);
  const items = lessons[selectedLevel];

  $('levels').innerHTML = levels.map(l => `
    <button class="level ${l.id===selectedLevel?'active':''}"
      data-level="${l.id}">
      <span class="pill" style="background:${l.color}">
        ${l.id}
      </span>
      <span>${l.name}</span>
    </button>
  `).join('');

  $('list-title').textContent = `${lvl.id} · ${lvl.name}`;

  $('list-subtitle').textContent = items.length
    ? `${items.length} example lessons`
    : 'Lessons coming soon';

  $('lessons').innerHTML = items.length
    ? items.map((l,i) => `
      <button class="lesson ${selectedLesson===i?'active':''}"
        data-lesson="${i}">
        <span class="num">
          CLASS ${String(l.number).padStart(2,'0')}
        </span>
        <strong>${escapeHtml(l.title)}</strong>
        <span class="desc">${escapeHtml(l.description)}</span>
      </button>
    `).join('')
    : '<p class="empty" style="padding:20px">No demo lessons for this level yet.</p>';

  const lesson = items[selectedLesson];

  $('reader').innerHTML = !lesson
    ? `<div class="empty">
        <h1>${lvl.id} lessons</h1>
        <p>Lessons will appear here once synchronized from Notion.</p>
      </div>`
    : `
      <div class="top">
        <span class="tag" style="background:${lvl.color}">
          ${lvl.id} · ${lvl.name}
        </span>
        <span class="sub">
          CLASS ${String(lesson.number).padStart(2,'0')} · DEMO
        </span>
      </div>

      <h1>${escapeHtml(lesson.title)}</h1>
      <p class="intro">${escapeHtml(lesson.description)}</p>

      <div class="objective">
        <strong>Communicative objective</strong>
        <p>${escapeHtml(lesson.objective)}</p>
      </div>

      <h3>01. Warm-up</h3>
      <p>Let's start with a few useful English expressions.</p>

      <div class="chips">
        <span class="chip">Hello!</span>
        <span class="chip">Hi!</span>
        <span class="chip">Good morning!</span>
      </div>

      <h3>02. Vocabulary</h3>
      <p>Greetings and goodbyes</p>

      <div class="sample">
        <div><span>English</span><span>Português</span></div>
        ${lesson.vocab.map(row => `
          <div>
            <span>${escapeHtml(row[0])}</span>
            <span>${escapeHtml(row[1])}</span>
          </div>
        `).join('')}
      </div>

      <h3>03. Language focus</h3>
      <p>${escapeHtml(lesson.grammar)}</p>

      <p class="sub">
        This is sample content only. The final lesson will
        display the full text, exercises, tables and images from Notion.
      </p>
    `;

  document.querySelectorAll('[data-level]').forEach(b =>
    b.addEventListener('click', () => {
      selectedLevel = b.dataset.level;
      selectedLesson = 0;
      render();
    })
  );

  document.querySelectorAll('[data-lesson]').forEach(b =>
    b.addEventListener('click', () => {
      selectedLesson = Number(b.dataset.lesson);
      render();
    })
  );
}

render();
</script>
</body>
</html>
